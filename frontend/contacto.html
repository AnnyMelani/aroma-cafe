<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Contacto | Aroma Café</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            ☕ Aroma Café
        </div>

        <nav>

            <a href="index.html">Inicio</a>
            <a href="menu.html">Menú</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="admin/login.html">Administración</a>

        </nav>

    </header>


    <main>

        <section class="section">

            <h1>Contacto</h1>

            <p>
                ¿Tienes alguna consulta?
                Escríbenos.
            </p>

            <br>

            <p>
                📍 Arequipa, Perú
            </p>

            <p>
                🕐 Lunes a sábado: 8:00 a.m. – 9:00 p.m.
            </p>

            <br>


            <form>

                <input
                    type="text"
                    placeholder="Nombre"
                    required
                >

                <br><br>

                <input
                    type="email"
                    placeholder="Correo electrónico"
                    required
                >

                <br><br>

                <textarea
                    placeholder="Mensaje"
                    rows="6"
                    required>
                </textarea>

                <br><br>

                <button
                    type="submit"
                    class="btn">
                    Enviar mensaje
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Aroma Café
        </p>

    </footer>

</body>

</html>
