<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto - Aroma Café</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/auth.js"></script>
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">☕ Aroma Café - Administración</div>

        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="productos.html">Productos</a>
            <a href="../index.html">Ver sitio</a>
        </div>
    </nav>
</header>

<main class="seccion">

    <div class="formulario-admin">

        <h1>Editar producto</h1>

        <form id="productoForm">

            <label>Nombre</label>
            <input type="text" id="nombre" required>

            <label>Descripción</label>
            <textarea id="descripcion" required></textarea>

            <label>Precio</label>
            <input type="number" id="precio" step="0.01" min="0" required>

            <label>Stock</label>
            <input type="number" id="stock" min="0" required>

            <label>Categoría</label>
            <select id="categoria" required></select>

            <label>URL de imagen</label>
            <input type="text" id="imagen_url">

            <button type="submit" class="btn">
                Guardar cambios
            </button>

        </form>

        <p id="mensaje"></p>

    </div>

</main>

<script src="../js/editar-producto.js"></script>

</body>
</html>
