<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aroma Café</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/auth.js"></script>
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">☕ Aroma Café - Administración</div>

        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="productos.html">Productos</a>
            <a href="../index.html">Ver sitio</a>
            <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
        </div>
    </nav>
</header>

<main class="seccion">

    <h1>Dashboard</h1>
    <p>Resumen de la gestión de Aroma Café.</p>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>Total de productos</h3>
            <p id="totalProductos">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Productos disponibles</h3>
            <p id="productosDisponibles">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Stock bajo</h3>
            <p id="productosStockBajo">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Categorías</h3>
            <p id="totalCategorias">0</p>
        </div>

    </div>

    <div class="acciones-admin">
        <a href="productos.html" class="btn">Gestionar productos</a>
        <a href="nuevo-producto.html" class="btn">Nuevo producto</a>
    </div>

</main>

<script src="../js/dashboard.js"></script>

</body>
</html>
